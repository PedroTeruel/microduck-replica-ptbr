# Se /run/microduck-helper/bus-held existir, o Microduck Studio está bloqueando o programa principal durante o ajuste dos servos. Para liberar: devolva o controle pelo Studio ou reinicie.
# Instale em /etc/systemd/system/robotd.service.d/zzzz-studio-bus.conf e execute systemctl daemon-reload (isso não reinicia o robotd).
# Não usamos systemctl mask --runtime porque a unidade robotd.service fica em /etc/systemd/system, e uma máscara em /run não a sobrepõe.
# O fork também usa essa abordagem para parar o updaterd em packaging/runtime.py. O marcador em /run desaparece após desligar ou reiniciar, e o robotd continua iniciando normalmente.
# Enquanto o marcador existir, systemctl start robotd retorna 0, mas a unidade permanece inactive com ConditionResult=no; não use o código de saída para concluir que iniciou.
[Unit]
ConditionPathExists=!/run/microduck-helper/bus-held

# Só habilite as duas linhas abaixo depois de validar a etapa 3 (devolver o controle pelo Studio sem desativar o torque); depois execute daemon-reload. Com isso, o robotd do fork
# verifica o marcador de transferência ao iniciar. Sem marcador, o comportamento é igual ao V167. Versões antigas do robotd ignoram esta variável.
#[Service]
#Environment=MICRODUCK_HANDOVER_MARKER=/run/microduck-handover/handover.json

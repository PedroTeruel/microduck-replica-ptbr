# O Studio é executado como usuário radxa e precisa chamar interfaces que alteram o estado, como net.connect e pad.pair.
# O configd verifica apenas o grupo principal do cliente. --allow-group robot não funciona porque radxa usa radxa como grupo principal; por isso, a autorização é feita pelo nome do usuário.
[Service]
ExecStart=
ExecStart=/opt/robot/daemon/current/bin/configd --allow-user btd,radxa

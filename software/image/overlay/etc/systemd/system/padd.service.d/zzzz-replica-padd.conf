# A imagem de réplica não usa o script Python de espera da imagem-base: se o robotd ainda não iniciou, o padd encerra,
# e o systemd tenta novamente após 5 segundos. A unidade oficial padd.service usa esse mesmo comportamento (Restart=always + RestartSec=5s).
[Service]
ExecStart=
ExecStart=/opt/robot/feetech-ft5-r5/padd --socket /run/robotd.sock --config /etc/robot/feetech-ft5/robotd.toml --max-head 2.5 --input-settings /etc/robot/feetech-ft5/pad-settings.json
RuntimeDirectory=padd
RestartPreventExitStatus=78

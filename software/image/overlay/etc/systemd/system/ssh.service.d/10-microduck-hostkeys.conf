# Imagem de réplica do Microduck: não inclui chaves SSH de host; cada cartão gera as próprias.
# O sshd-keygen.service do sistema só roda na “primeira inicialização” (ConditionFirstBoot). Esvaziar o arquivo
# machine-id pode não contar como primeira inicialização: sem as chaves, sshd -t falha e a porta 22 não abre (foi o que ocorreu no cartão validado em 21/10).
# Portanto, gere as chaves ausentes antes de cada inicialização (ssh-keygen -A só cria as que faltam e preserva as existentes).
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t

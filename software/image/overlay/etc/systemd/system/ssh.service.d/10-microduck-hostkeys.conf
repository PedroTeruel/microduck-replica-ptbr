# Microduck 复刻镜像：镜像里不带 SSH 主机钥匙，每张卡自己生成。
# 系统自带的 sshd-keygen.service 只在「第一次开机」（ConditionFirstBoot）跑，清空成空文件的
# machine-id 不一定被当成第一次开机：钥匙没生成，sshd -t 失败，22 端口不开（10-21 验收卡上就是这样）。
# 所以每次启动前补生成缺的钥匙（ssh-keygen -A 只补没有的，已有的不动）。
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t

# =============================================================================
# Cargo.toml — identificação do projeto Rust e lista de dependências
#
# Cargo é a ferramenta oficial de build e gerenciador de pacotes do Rust (combina o Makefile e o download manual de bibliotecas do C,
# ou o pip e o venv do Python, em uma única ferramenta).
# Este arquivo informa ao Cargo:
#   1. O nome e a versão deste pacote (seção [package]).
#   2. Quais bibliotecas de terceiros baixar do crates.io, repositório oficial do Rust (seção [dependencies]).
#
# Comandos de build:
#   cargo build           # Build de depuração (compila rápido, executa mais devagar; arquivos em target/debug/).
#   cargo build --release # Build de lançamento (compila mais devagar, executa mais rápido; arquivos em target/release/).
#   cargo run -- <args>   # Compila e executa; os argumentos após -- são passados ao programa.
# =============================================================================

[package]
name = "feetech-HD1910M-tester" # Nome do pacote; também é o nome do executável gerado.
version = "0.1.0"
edition = "2021"                # Edição da linguagem Rust; 2021 é a edição usada neste projeto.
description = "Ferramenta serial de teste para servos Feetech HD1910M (protocolo FT-SCS)"

# [Alvo da biblioteca] src/lib.rs será compilado como feetech_servo,
# reutilizável por projetos GUI (ou outros projetos Rust) por dependência de caminho.
[lib]
name = "feetech_servo"
path = "src/lib.rs"

[dependencies]
# serialport: biblioteca serial multiplataforma. O servo é conectado a /dev/ttyUSB0 por um conversor USB para TTL (CH340);
# esta dependência abre a porta, define a taxa de transmissão e envia/recebe bytes.
serialport = "4.7"

# thiserror: permite definir erros estruturados com uma anotação #[error("...")],
# evitando código repetitivo. O tratamento de erros é um dos recursos centrais do Rust.
thiserror = "2"

# ==================== As dependências abaixo são usadas somente pela CLI (main.rs) ====================
# clap e indicatif precisam estar em [dependencies], fora de [dev-dependencies], para que a CLI possa usá-las.
# Projetos GUI que dependem da biblioteca em [lib] também as incluirão; o custo de tamanho é aceitável.
# Para minimizar o pacote, a CLI poderia ser separada, mas este projeto didático mantém a estrutura simples.

# clap: biblioteca para analisar argumentos de linha de comando. O recurso derive permite declarar
# argumentos com anotações em structs e gerar automaticamente --help, validação de parâmetros etc.
clap = { version = "4.5", features = ["derive"] }

# indicatif: biblioteca de barras de progresso para terminal, padrão de fato no ecossistema Rust.
# Exibe uma barra, animação giratória e tempo estimado durante a varredura do barramento.
indicatif = "0.17"

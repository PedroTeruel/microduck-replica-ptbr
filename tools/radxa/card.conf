# Configuração do cartão: personalize, salve e clique com o botão direito no script PowerShell da pasta.
WIFI_SSID=ALTERE_PARA_O_NOME_DA_REDE
WIFI_PASSWORD=ALTERE_PARA_A_SENHA_DA_REDE
# As contas e senhas abaixo só passam a valer após o primeiro login root / 1234 e a conclusão do assistente do Armbian.
USER_NAME=duck
USER_PASSWORD=duck1234
ROOT_PASSWORD=duck1234
# Opcional: proxy HTTP usado pela placa para acessar a internet (por exemplo, para baixar pacotes do GitHub); deixe vazio se não usar.
HTTP_PROXY=
